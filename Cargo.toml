[workspace]
members = [".", "packages/event_sourcing"]

[package]
name = "rag-admin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Retrieval Augmented Generation Admin app for chunking, embedding, and indexing documents, with evaluations and autotuning to find optimal settings."
repository = "https://github.com/kieran-gray/rag-admin"
categories = ["RAG", "leptos", "dashboard"]
keywords = ["RAG", "leptos", "dashboard"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_meta = "0.8"
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

axum = { version = "0.8", features = ["ws", "multipart"], optional = true }
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
time = { version = "0.3", features = [
    "serde",
    "formatting",
    "parsing",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
tiktoken-rs = { version = "0.11", optional = true }
enum-map = { version = "2.7", optional = true }
markdown = { version = "1.0.0", optional = true }
htmd = { version = "0.5", optional = true }
pdf-extract = { version = "0.9", optional = true }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
    "time",
], optional = true }
event_sourcing = { path = "packages/event_sourcing", optional = true }
thiserror = "2"
urlencoding = "2"

console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "EventSource",
    "MessageEvent",
    "WebSocket",
    "CloseEvent",
    "Window",
    "Location",
    "Storage",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "DragEvent",
    "DataTransfer",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
uuid = { version = "1.18", features = ["v4", "v5", "v7", "js", "serde"] }
readability-rust = { version = "0.1.0", optional = true }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:sha2",
    "dep:hex",
    "dep:async-trait",
    "dep:futures-util",
    "dep:async-stream",
    "dep:time",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tiktoken-rs",
    "dep:enum-map",
    "dep:markdown",
    "dep:htmd",
    "dep:pdf-extract",
    "dep:readability-rust",
    "dep:sqlx",
    "dep:event_sourcing",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1.47", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
    "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18", features = ["v4", "v5", "v7", "serde"] }
async-trait = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[[test]]
name = "event_store"
path = "tests/event_store.rs"
required-features = ["ssr"]

[[test]]
name = "job_queue"
path = "tests/job_queue.rs"
required-features = ["ssr"]

[[test]]
name = "projection_driver"
path = "tests/projection_driver.rs"
required-features = ["ssr"]

[[test]]
name = "process_manager"
path = "tests/process_manager.rs"
required-features = ["ssr"]

[package.metadata.cargo-all-features]
denylist = [
    "axum",
    "tokio",
    "leptos_axum",
    "reqwest",
    "sha2",
    "hex",
    "async-trait",
    "futures-util",
    "async-stream",
    "time",
    "tracing",
    "tracing-subscriber",
    "tiktoken-rs",
    "enum-map",
    "markdown",
    "htmd",
    "readability-rust",
]
skip_feature_sets = [["ssr", "hydrate"], []]

[package.metadata.leptos]
output-name = "rag_admin"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "./src/ui/styles/global.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

[lints.clippy]
# don't stop from compiling / running
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
# pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Transitive dependency version conflicts cannot be fixed at this crate's level
multiple_crate_versions = "allow"

# Don't Panic - prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
expect_used = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Style lints
absolute_paths = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
elidable_lifetime_names = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
format_push_string = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
inconsistent_struct_constructor = "warn"
manual_let_else = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"
