services:
  rag-admin:
    image: 'rag-admin:latest'
    build:
      context: .
      target: runtime
    restart: "no"
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - LLAMA_SERVER_BASE_URL=${LLAMA_SERVER_BASE_URL:-http://llama-swap:8080}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5

  llama-swap:
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/mostlygeek/llama-swap:cuda}
    restart: "no"
    profiles:
      - llama
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/llama-swap/config.yaml:/app/config.yaml:ro
      - llama-models:/models
    environment:
      - LLAMA_CACHE=/models
    command: ["-config", "/app/config.yaml", "-listen", ":8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${LLAMA_SERVER_MEMORY_LIMIT:-24g}
        reservations:
          memory: ${LLAMA_SERVER_MEMORY_RESERVATION:-16g}
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-pull-models:
    image: ${LLAMA_SWAP_IMAGE:-ghcr.io/mostlygeek/llama-swap:cuda}
    profiles: ["pull"]
    restart: "no"
    volumes:
      - llama-models:/models
    environment:
      - HF_TOKEN=${HF_ACCESS_TOKEN}
      - LLAMA_CACHE=/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -ue
        pull() {
          model="$$1"
          shift
          echo ">>> Pre-pulling $$model"
          before=$$(du -sb /models 2>/dev/null | cut -f1 || echo 0)
          /app/llama-server -hf "$$model" --port 9999 -ngl 0 -c 256 "$$@" 2>&1 &
          pid=$$!
          ticks=0
          loaded=0
          while kill -0 "$$pid" 2>/dev/null; do
            if curl -fs http://localhost:9999/health >/dev/null 2>&1; then
              echo ">>> Loaded $$model"
              loaded=1
              break
            fi
            ticks=$$((ticks + 1))
            if [ $$((ticks % 10)) -eq 0 ]; then
              size=$$(du -sh /models 2>/dev/null | cut -f1 || echo "?")
              delta=$$(( $$(du -sb /models 2>/dev/null | cut -f1 || echo 0) - before ))
              echo "    [progress] /models=$$size  (+$$((delta / 1048576)) MiB since start)"
            fi
            sleep 3
          done
          kill "$$pid" 2>/dev/null || true
          wait "$$pid" 2>/dev/null || true
          if [ "$$loaded" -ne 1 ]; then
            echo ">>> FAILED $$model" >&2
            return 1
          fi
          echo ">>> Done $$model"
        }
        pull "google/gemma-3-4b-it-qat-q4_0-gguf:Q4_0" || exit 1
        pull "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0" --embedding --pooling mean || exit 1
        pull "mradermacher/Qwen3-Reranker-0.6B-GGUF:Q8_0" --reranking --pooling rank || exit 1

  ollama:
    image: ollama/ollama:latest
    profiles: 
      - "ollama"
    restart: "no"
    ports:
      - "11435:11435"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_HOST=0.0.0.0:11435
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-24g}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-16g}
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-embedding:
    image: ollama/ollama:latest
    profiles: 
      - "ollama"
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11435
    entrypoint: [ "ollama" ]
    command: [ "pull", "qwen3-embedding:0.6b" ]

  ollama-pull-generation:
    image: ollama/ollama:latest
    profiles: 
      - "ollama"
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11435
    entrypoint: [ "ollama" ]
    command: [ "pull", "gemma3:12b-it-qat" ]

  db:
    image: pgvector/pgvector:pg18-trixie
    restart: "no"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?unset}
      - POSTGRES_USER=${POSTGRES_USER?unset}
      - POSTGRES_DB=${POSTGRES_DB?unset}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

volumes:
  app-db-data:
  llama-models:
  ollama-data:
